packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  prisma: true

saveExact: true
engineStrict: true
strictPeerDependencies: true
confirmModulesPurge: false
verifyDepsBeforeRun: warn

overrides:
  # Redocly 1.x reads the js-yaml 4.x `types` API during OpenAPI generation.
  js-yaml: 4.3.1
