packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  prisma: true

saveExact: true
engineStrict: true
strictPeerDependencies: true
confirmModulesPurge: false
verifyDepsBeforeRun: warn

overrides:
  # Redocly 1.x reads the js-yaml 4.x `types` API during OpenAPI generation.
  js-yaml: 4.3.1
  # drizzle-kit pulls a legacy esbuild through @esbuild-kit; pin it to the patched runtime API.
  esbuild: 0.28.2
  # Prisma 7.9.1 still pins the advisory-affected 7.x release; 8.0.1 contains the stack-exhaustion fix.
  deepmerge-ts: 8.0.1
