packages:
  - apps/*
  - packages/*

allowBuilds:
  '@scarf/scarf': false
  esbuild: true

saveExact: true
engineStrict: true
strictPeerDependencies: true
autoInstallPeers: false
confirmModulesPurge: false
verifyDepsBeforeRun: warn

overrides:
  # drizzle-kit pulls a legacy esbuild through @esbuild-kit; pin it to the patched runtime API.
  esbuild: 0.28.2
