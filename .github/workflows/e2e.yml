name: E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_USER: careerground
          POSTGRES_PASSWORD: careerground
          POSTGRES_DB: careerground
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerground -d careerground"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://careerground:careerground@127.0.0.1:5432/careerground?schema=public
      BOOTSTRAP_ADMIN_EMAIL: admin@careerground.local
      BOOTSTRAP_ADMIN_PASSWORD: Demo-password-123!
      JWT_ACCESS_SECRET: e2e-access-secret-with-at-least-32-characters
      JWT_REFRESH_SECRET: e2e-refresh-secret-with-at-least-32-characters
      INTERNAL_SERVICE_SECRET: e2e-internal-secret-with-at-least-32-characters
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report and visual evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
