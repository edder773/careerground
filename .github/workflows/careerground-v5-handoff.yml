name: CareerGround v5 artifact handoff

on:
  issues:
    types: [opened, edited, labeled, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: careerground-v5-artifact-handoff
  cancel-in-progress: false

jobs:
  receive:
    if: >-
      contains(github.event.issue.labels.*.name, 'careerground-v5-handoff') &&
      (github.event.issue.author_association == 'OWNER' ||
       github.event.issue.author_association == 'MEMBER' ||
       github.event.issue.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve and fetch an immutable handoff bundle
        id: handoff
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: >-
          pnpm jobs:v5:handoff fetch
          --issue-number "$GITHUB_EVENT_ISSUE_NUMBER"
          --output work/jobs-v5/handoff
          --github-output "$GITHUB_OUTPUT"
      - name: Validate the baseline-free discovery bundle
        if: >-
          steps.handoff.outputs.status == 'READY' &&
          steps.handoff.outputs.handoff_schema_version == '2.0'
        env:
          TARGET_DATE: ${{ steps.handoff.outputs.target_as_of_date }}
          HANDOFF_ATTEMPT: ${{ steps.handoff.outputs.handoff_attempt }}
        run: |
          RUN_ID="CG-$TARGET_DATE-A$HANDOFF_ATTEMPT-discovery"
          pnpm jobs:v5:validate-discovery \
            --target-as-of-date "$TARGET_DATE" \
            --run-id "$RUN_ID" \
            --partition1 "work/jobs-v5/handoff/careerground-partition-1-$TARGET_DATE.json" \
            --partition2 "work/jobs-v5/handoff/careerground-partition-2-$TARGET_DATE.json" \
            --partition3 "work/jobs-v5/handoff/careerground-partition-3-$TARGET_DATE.json" \
            --output work/jobs-v5/discovery
          ! grep -R -E 'hooks\.slack\.com/services|gh[pousr]_[A-Za-z0-9]+' work/jobs-v5/discovery
      - name: Convert the verified legacy v4 bundle to v5 partition artifacts
        if: >-
          steps.handoff.outputs.status == 'READY' &&
          steps.handoff.outputs.handoff_schema_version == '1.0'
        env:
          TARGET_DATE: ${{ steps.handoff.outputs.target_as_of_date }}
          RUN_ID: CG-${{ steps.handoff.outputs.target_as_of_date }}-A1-handoff${{ github.run_id }}
        run: |
          pnpm jobs:v5:adapt-v4 \
            --target-as-of-date "$TARGET_DATE" \
            --run-id "$RUN_ID" \
            --partition1 "work/jobs-v5/handoff/careerground-partition-1-$TARGET_DATE.json" \
            --partition2 "work/jobs-v5/handoff/careerground-partition-2-$TARGET_DATE.json" \
            --partition3 "work/jobs-v5/handoff/careerground-partition-3-$TARGET_DATE.json" \
            --final "work/jobs-v5/handoff/careerground-jobs-live-$TARGET_DATE-final.json" \
            --audit "work/jobs-v5/handoff/careerground-merge-audit-$TARGET_DATE.json" \
            --output work/jobs-v5/converted
          ! grep -R -E 'hooks\.slack\.com/services|gh[pousr]_[A-Za-z0-9]+' work/jobs-v5/converted
      - name: Save only the pointer report while waiting
        if: steps.handoff.outputs.status == 'WAITING'
        uses: actions/upload-artifact@v6
        with:
          name: careerground-v5-handoff-waiting-${{ github.run_id }}
          path: work/jobs-v5/handoff/handoff-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Save the validated discovery bundle
        if: >-
          steps.handoff.outputs.status == 'READY' &&
          steps.handoff.outputs.handoff_schema_version == '2.0'
        uses: actions/upload-artifact@v6
        with:
          name: careerground-v5-${{ steps.handoff.outputs.target_as_of_date }}-discovery-ready
          path: |
            work/jobs-v5/handoff/handoff-report.json
            work/jobs-v5/discovery
          if-no-files-found: error
          retention-days: 30
      - name: Save the converted legacy compatibility bundle
        if: >-
          steps.handoff.outputs.status == 'READY' &&
          steps.handoff.outputs.handoff_schema_version == '1.0'
        uses: actions/upload-artifact@v6
        with:
          name: careerground-v5-${{ steps.handoff.outputs.target_as_of_date }}-legacy-compatible
          path: |
            work/jobs-v5/handoff/handoff-report.json
            work/jobs-v5/converted
          if-no-files-found: error
          retention-days: 30
      - name: Publish the verified discovery bundle to production D1
        if: >-
          steps.handoff.outputs.status == 'READY' &&
          steps.handoff.outputs.handoff_schema_version == '2.0'
        env:
          CAREERGROUND_PUBLISH_URL: https://careerground-workspace.edder773.chatgpt.site/api/v1/internal/jobs-v5/publish
          CAREERGROUND_PUBLISH_TOKEN: ${{ secrets.CAREERGROUND_PUBLISH_TOKEN }}
          TARGET_DATE: ${{ steps.handoff.outputs.target_as_of_date }}
        run: |
          pnpm jobs:v5:publish-discovery \
            --handoff work/jobs-v5/handoff/handoff-report.json \
            --report work/jobs-v5/discovery/discovery-report.json \
            --partition1 work/jobs-v5/discovery/partition-1.json \
            --partition2 work/jobs-v5/discovery/partition-2.json \
            --partition3 work/jobs-v5/discovery/partition-3.json \
            --output work/jobs-v5/discovery/publish-receipt.json
          ! grep -R -E 'hooks\.slack\.com/services|gh[pousr]_[A-Za-z0-9]+' work/jobs-v5/discovery
      - name: Save the production publish receipt
        if: >-
          steps.handoff.outputs.status == 'READY' &&
          steps.handoff.outputs.handoff_schema_version == '2.0'
        uses: actions/upload-artifact@v6
        with:
          name: careerground-v5-${{ steps.handoff.outputs.target_as_of_date }}-publish-receipt
          path: work/jobs-v5/discovery/publish-receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Mark the validated source pointers as processed
        if: steps.handoff.outputs.status == 'READY'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          pnpm jobs:v5:handoff mark-processed
          --report work/jobs-v5/handoff/handoff-report.json
