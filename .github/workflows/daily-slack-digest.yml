name: Daily CareerGround Slack digest

on:
  workflow_run:
    workflows: ['Production SLO smoke']
    types: [completed]
  repository_dispatch:
    types: [jobs-v5-published]
  schedule:
    - cron: '1 8 * * 1-5'
      timezone: 'Asia/Seoul'
    - cron: '11 8 * * 1-5'
      timezone: 'Asia/Seoul'
    - cron: '21 8 * * 1-5'
      timezone: 'Asia/Seoul'
    - cron: '31 8 * * 1-5'
      timezone: 'Asia/Seoul'
    - cron: '41 8 * * 1-5'
      timezone: 'Asia/Seoul'
    - cron: '51 8 * * 1-5'
      timezone: 'Asia/Seoul'
    - cron: '17 9 * * 1-5'
      timezone: 'Asia/Seoul'
  workflow_dispatch:
    inputs:
      force:
        description: '주말·공휴일에도 강제로 전송'
        type: boolean
        default: true
      snapshot_created_at:
        description: '특정 import 스냅샷의 created_at(ISO 8601)을 재전송'
        type: string
        default: ''
      jobs_only:
        description: '스냅샷의 채용공고만 재전송'
        type: boolean
        default: false
      dry_run:
        description: 'Slack 전송·claim 저장 없이 운영 준비 상태와 메시지 형식만 검증'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-careerground-slack-digest
  cancel-in-progress: false

jobs:
  send:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Send CareerGround digest
        id: digest
        continue-on-error: true
        env:
          CAREERGROUND_DIGEST_URL: https://careerground-workspace.edder773.chatgpt.site/api/v1/internal/slack-digest
          CAREERGROUND_DIGEST_TOKEN: ${{ secrets.CAREERGROUND_DIGEST_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BAEUMZIP_URL: https://www.baeumzip.site/
          SLACK_DIGEST_FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
          SLACK_DIGEST_SNAPSHOT_CREATED_AT: ${{ github.event_name == 'workflow_dispatch' && inputs.snapshot_created_at || '' }}
          SLACK_DIGEST_JOBS_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.jobs_only || false }}
          SLACK_DIGEST_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          SLACK_DIGEST_WINDOW_START: ${{ (github.event_name == 'workflow_run' || github.event_name == 'repository_dispatch') && '08:01' || '' }}
          SLACK_DIGEST_WINDOW_END: ${{ (github.event_name == 'workflow_run' || github.event_name == 'repository_dispatch') && '10:30' || '' }}
          SLACK_DIGEST_FRESH_UNTIL: ${{ (github.event_name == 'workflow_run' || github.event_name == 'repository_dispatch') && '08:31' || '' }}
          SLACK_DIGEST_REQUIRE_FRESH_JOBS: ${{ github.event_name == 'schedule' && github.event.schedule != '51 8 * * 1-5' && github.event.schedule != '17 9 * * 1-5' }}
        run: node scripts/slack/send-daily-digest.mjs

      - name: Open or update the jobs refresh incident
        if: always() && github.event_name != 'workflow_dispatch' && steps.digest.outputs.delivery_status == 'job-import-not-ready'
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          INCIDENT_TITLE: '[운영 경보] 채용 DB 갱신 지연'
        with:
          script: |
            const title = process.env.INCIDENT_TITLE;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `직전 성공 알림 이후 채용 import가 아직 COMMITTED 상태가 아니어서 Slack 발송을 보류했습니다. 다음 fallback 예약이 재확인합니다.\n\n- 감지: ${new Date().toISOString()}\n- 실행: ${runUrl}`;
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }

      - name: Close the jobs refresh incident after readiness recovery
        if: always() && github.event_name != 'workflow_dispatch' && (steps.digest.outputs.delivery_status == 'sent' || steps.digest.outputs.delivery_status == 'already-sent')
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          INCIDENT_TITLE: '[운영 경보] 채용 DB 갱신 지연'
        with:
          script: |
            const title = process.env.INCIDENT_TITLE;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (!existing) return;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              ...context.repo, issue_number: existing.number,
              body: `채용 DB 준비 상태가 정상화되었습니다.\n\n- 확인: ${new Date().toISOString()}\n- 실행: ${runUrl}`,
            });
            await github.rest.issues.update({
              ...context.repo, issue_number: existing.number, state: 'closed', state_reason: 'completed',
            });

      - name: Measure the 08:01 KST schedule delay
        id: schedule_delay
        if: github.event_name == 'schedule' && github.event.schedule == '1 8 * * 1-5' && (steps.digest.outputs.delivery_status == 'sent' || steps.digest.outputs.delivery_status == 'already-sent' || steps.digest.outputs.delivery_status == 'job-import-not-ready')
        continue-on-error: true
        env:
          SCHEDULE_EXPECTED_HOUR: '8'
          SCHEDULE_EXPECTED_MINUTE: '1'
          SCHEDULE_CRON: ${{ github.event.schedule }}
          SCHEDULE_DELAY_BUDGET_MINUTES: '15'
          SCHEDULE_DELAY_OUTPUT_FILE: work/operations/daily-schedule-delay.json
        run: node scripts/operations/check-schedule-delay.mjs

      - name: Upload schedule delay evidence
        if: always() && steps.schedule_delay.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: daily-schedule-delay-${{ github.run_id }}
          path: work/operations/daily-schedule-delay.json
          if-no-files-found: error
          retention-days: 30

      - name: Open or update the schedule delay incident
        if: always() && steps.schedule_delay.outcome == 'failure'
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          INCIDENT_TITLE: '[운영 경보] Daily Slack digest 예약 지연'
          REPORT_PATH: work/operations/daily-schedule-delay.json
        with:
          script: |
            const fs = require('fs');
            const title = process.env.INCIDENT_TITLE;
            const report = fs.existsSync(process.env.REPORT_PATH)
              ? JSON.parse(fs.readFileSync(process.env.REPORT_PATH, 'utf8'))
              : {};
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '오전 8시 1분 KST 목표 시각이 허용 지연 시간을 넘었습니다. fallback 예약으로 메시지 전송을 계속 시도합니다.',
              '',
              `- 예정 시각: ${report.expectedAt || '측정 실패'}`,
              `- 감지 시각: ${report.observedAt || new Date().toISOString()}`,
              `- 지연: ${report.delayMinutes ?? '측정 실패'}분 (기준 ${report.thresholdMinutes ?? 15}분)`,
              `- 실행: ${runUrl}`,
              '',
              `원본 JSON은 실행의 \`daily-schedule-delay-${context.runId}\` 아티팩트에 30일간 보관됩니다.`,
            ].join('\n');
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }

      - name: Close the schedule delay incident after an on-time start
        if: always() && steps.schedule_delay.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          INCIDENT_TITLE: '[운영 경보] Daily Slack digest 예약 지연'
        with:
          script: |
            const title = process.env.INCIDENT_TITLE;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (!existing) return;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              ...context.repo, issue_number: existing.number,
              body: `08:01 목표 예약이 15분 이내로 정상화되었습니다.\n\n- 확인: ${new Date().toISOString()}\n- 실행: ${runUrl}`,
            });
            await github.rest.issues.update({
              ...context.repo, issue_number: existing.number, state: 'closed', state_reason: 'completed',
            });

      - name: Open or update the digest delivery incident
        if: always() && steps.digest.outcome == 'failure' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          INCIDENT_TITLE: '[운영 경보] Daily Slack digest 전송 실패'
        with:
          script: |
            const title = process.env.INCIDENT_TITLE;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'CareerGround 일일 요약 전송이 실패했습니다. 민감한 token과 webhook 원문은 기록하지 않습니다.',
              '',
              `- 감지 시각: ${new Date().toISOString()}`,
              `- 기준 커밋: \`${context.sha}\``,
              `- 실행: ${runUrl}`,
              '',
              'Slack 4xx, digest API 인증, 또는 UNCERTAIN delivery 상태를 실행 로그의 상태 코드로 확인하세요.',
            ].join('\n');
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }

      - name: Close the digest delivery incident after recovery
        if: always() && (steps.digest.outputs.delivery_status == 'sent' || steps.digest.outputs.delivery_status == 'already-sent')
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          INCIDENT_TITLE: '[운영 경보] Daily Slack digest 전송 실패'
        with:
          script: |
            const title = process.env.INCIDENT_TITLE;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (!existing) return;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: existing.number,
              body: `일일 요약 전송이 정상화되었습니다.\n\n- 확인: ${new Date().toISOString()}\n- 실행: ${runUrl}`,
            });
            await github.rest.issues.update({
              ...context.repo,
              issue_number: existing.number,
              state: 'closed',
              state_reason: 'completed',
            });

      - name: Fail when digest delivery fails
        if: always() && steps.digest.outcome == 'failure' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: exit 1
