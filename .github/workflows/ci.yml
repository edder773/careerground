name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:d1:generate
      - run: git diff --exit-code -- drizzle
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm performance:budget
      - run: pnpm recovery:drill
      - run: pnpm build
      - run: pnpm bundle:budget
      - name: Install Chromium for pull-request E2E
        if: github.event_name == 'pull_request'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run pull-request E2E
        if: github.event_name == 'pull_request'
        run: pnpm test:e2e --project=chromium --project=chromium-mobile-375
      - name: Install the full browser set after merge
        if: github.event_name == 'push'
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run the full cross-browser E2E suite after merge
        if: github.event_name == 'push'
        run: pnpm test:e2e
      - name: Upload Playwright report and visual evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
