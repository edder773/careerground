name: CareerGround jobs v5 (pre-cutover)

# The approved production target is 18:00 Asia/Seoul (09:00 UTC), weekdays.
# A schedule is intentionally absent until legacy tasks are paused and PUBLISH is approved.
on:
  workflow_dispatch:
    inputs:
      targetAsOfDate:
        description: '고정 실행 기준일(YYYY-MM-DD)'
        type: string
        required: true
      mode:
        description: '실행 모드'
        type: choice
        options: [DRY_RUN, RESUME, PUBLISH]
        default: DRY_RUN
      runGroupKey:
        description: 'RESUME 대상 CG-YYYY-MM-DD'
        type: string
        required: false
      approvedRunId:
        description: 'PUBLISH 승인을 받은 VERIFIED runId'
        type: string
        required: false
      forceRecollect:
        description: '성공 파티션도 다시 수집'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: careerground-jobs-v5-${{ inputs.targetAsOfDate }}
  cancel-in-progress: false

env:
  V5_WORKFLOW_ID: CG-JOBS-PROD-V5
  V5_SCHEMA_VERSION: '5.0'
  V5_RUN_ID: CG-${{ inputs.targetAsOfDate }}-A1-gh${{ github.run_id }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_id: ${{ steps.identity.outputs.run_id }}
      should_run: ${{ steps.identity.outputs.should_run }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate fixed execution identity
        id: identity
        env:
          TARGET_DATE: ${{ inputs.targetAsOfDate }}
          RUN_GROUP_KEY: ${{ inputs.runGroupKey }}
          EXECUTION_MODE: ${{ inputs.mode }}
        run: |
          test -z "$RUN_GROUP_KEY" || test "$RUN_GROUP_KEY" = "CG-$TARGET_DATE"
          pnpm jobs:v5:preflight --target-as-of-date "$TARGET_DATE" --run-id "$V5_RUN_ID" --mode "$EXECUTION_MODE" > work-preflight.json
          cat work-preflight.json
          node --input-type=module -e "import fs from 'node:fs'; const v=JSON.parse(fs.readFileSync('work-preflight.json')); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'should_run='+String(!v.skipped)+'\\n')"
          echo "run_id=$V5_RUN_ID" >> "$GITHUB_OUTPUT"

  collect:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require external collector outside DRY_RUN
        if: inputs.mode != 'DRY_RUN'
        run: |
          echo 'External partition collector is MANUAL_REQUIRED; refusing to substitute fixtures.' >&2
          exit 1
      - name: Build a non-production partition fixture
        if: inputs.mode == 'DRY_RUN'
        env:
          PARTITION_ID: ${{ matrix.partition }}
          TARGET_DATE: ${{ inputs.targetAsOfDate }}
          RUN_ID: ${{ needs.preflight.outputs.run_id }}
        run: |
          mkdir -p "work/jobs-v5/partition-$PARTITION_ID"
          node --input-type=module -e "import fs from 'node:fs'; const id=process.env.PARTITION_ID; const value=JSON.parse(fs.readFileSync('scripts/jobs-v5/fixtures/partition-'+id+'.json')); value.runId=process.env.RUN_ID; value.runGroupKey='CG-'+process.env.TARGET_DATE; value.targetAsOfDate=process.env.TARGET_DATE; fs.writeFileSync('work/jobs-v5/partition-'+id+'/result.json', JSON.stringify(value, null, 2)+'\\n')"
      - uses: actions/upload-artifact@v6
        if: inputs.mode == 'DRY_RUN'
        with:
          name: careerground-v5-${{ needs.preflight.outputs.run_id }}-partition-${{ matrix.partition }}
          path: work/jobs-v5/partition-${{ matrix.partition }}/result.json
          if-no-files-found: error
          retention-days: 30

  merge:
    needs: [preflight, collect]
    if: needs.preflight.outputs.should_run == 'true' && needs.collect.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: careerground-v5-${{ needs.preflight.outputs.run_id }}-partition-*
          path: work/jobs-v5/artifacts
      - name: Merge and validate explicit artifacts
        run: |
          pnpm jobs:v5:dry-run \
            --target-as-of-date "${{ inputs.targetAsOfDate }}" \
            --run-id "${{ needs.preflight.outputs.run_id }}" \
            --partition1 work/jobs-v5/artifacts/careerground-v5-${{ needs.preflight.outputs.run_id }}-partition-1/result.json \
            --partition2 work/jobs-v5/artifacts/careerground-v5-${{ needs.preflight.outputs.run_id }}-partition-2/result.json \
            --partition3 work/jobs-v5/artifacts/careerground-v5-${{ needs.preflight.outputs.run_id }}-partition-3/result.json \
            --output work/jobs-v5/result
      - uses: actions/upload-artifact@v6
        with:
          name: careerground-v5-${{ needs.preflight.outputs.run_id }}-verified
          path: work/jobs-v5/result
          if-no-files-found: error
          retention-days: 30

  validate:
    needs: [preflight, merge]
    if: needs.preflight.outputs.should_run == 'true' && needs.merge.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: careerground-v5-${{ needs.preflight.outputs.run_id }}-verified
          path: work/jobs-v5/result
      - name: Verify manifest contract and secret-free output
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import {validateManifest,assertManifestChecksum} from './scripts/jobs-v5/manifest.mjs'; const value=JSON.parse(fs.readFileSync('work/jobs-v5/result/manifest.json')); validateManifest(value); assertManifestChecksum(value); if(value.status!=='VERIFIED') process.exit(1)"
          ! grep -R -E 'hooks\.slack\.com/services|gh[pousr]_[A-Za-z0-9]+' work/jobs-v5/result

  publish:
    needs: [preflight, validate]
    if: inputs.mode == 'PUBLISH' && github.ref == 'refs/heads/main' && inputs.approvedRunId == needs.preflight.outputs.run_id
    runs-on: ubuntu-latest
    environment: careerground-production
    steps:
      - name: Cutover guard
        run: |
          echo 'Production D1 adapter activation remains MANUAL_REQUIRED during pre-cutover.' >&2
          exit 1

  notify:
    needs: [preflight, collect, merge, validate, publish]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record notification decision without sending Slack
        env:
          RUN_ID: ${{ needs.preflight.outputs.run_id }}
          COLLECT_RESULT: ${{ needs.collect.result }}
          MERGE_RESULT: ${{ needs.merge.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          mkdir -p work/jobs-v5/notify
          printf '{"runId":"%s","slackSent":false,"collect":"%s","merge":"%s","validate":"%s","publish":"%s"}\n' "$RUN_ID" "$COLLECT_RESULT" "$MERGE_RESULT" "$VALIDATE_RESULT" "$PUBLISH_RESULT" > work/jobs-v5/notify/status.json
      - uses: actions/upload-artifact@v6
        with:
          name: careerground-v5-notify-${{ github.run_id }}
          path: work/jobs-v5/notify/status.json
          if-no-files-found: error
          retention-days: 30
