name: careerground
services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_USER: careerground
      POSTGRES_PASSWORD: careerground
      POSTGRES_DB: careerground
    ports:
      - '5432:5432'
    volumes:
      - careerground-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U careerground -d careerground']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  careerground-postgres:
